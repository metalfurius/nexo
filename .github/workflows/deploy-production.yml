name: Deploy Production

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Existing vX.Y.Z release tag to redeploy
        required: true
        type: string
      skip_seed:
        description: Skip the idempotent public catalog seed write
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  pages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  FIREBASE_PROJECT_ID: recomendaciones-78eb7

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      version: ${{ steps.revision.outputs.version }}
    steps:
      - name: Checkout approved revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Wait for matching successful CI run on main push
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          for attempt in {1..60}; do
            result="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs?event=push&branch=main&head_sha=${COMMIT_SHA}&per_page=100" \
              --jq '.workflow_runs[] | select(.name == "CI") | [.status, .conclusion, .id] | @tsv' | head -n 1)"
            if [[ -n "$result" ]]; then
              read -r status conclusion run_id <<< "$result"
              if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                echo "CI run $run_id completed successfully for $COMMIT_SHA."
                exit 0
              fi
              if [[ "$status" == "completed" ]]; then
                echo "CI run $run_id concluded $conclusion for $COMMIT_SHA."
                exit 1
              fi
            fi
            sleep 5
          done
          echo "No successful CI run completed for $COMMIT_SHA before the release gate timeout."
          exit 1

      - name: Require an existing immutable release tag for manual redeploys
        if: github.event_name == 'workflow_dispatch'
        env:
          REDEPLOY_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          node -e "const ref=process.env.REDEPLOY_REF||'';if(!/^v(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-[0-9A-Za-z.-]+)?(?:\\+[0-9A-Za-z.-]+)?$/.test(ref)){console.error('ref must be an immutable SemVer release tag.');process.exit(1)}"
          git show-ref --verify --quiet "refs/tags/$REDEPLOY_REF" || {
            echo "$REDEPLOY_REF is not an existing tag."
            exit 1
          }
          test "$(git rev-parse "refs/tags/$REDEPLOY_REF^{commit}")" = "$(git rev-parse HEAD)" || {
            echo "Checked out revision does not match $REDEPLOY_REF."
            exit 1
          }
          git merge-base --is-ancestor HEAD origin/main || {
            echo "$REDEPLOY_REF is not reachable from origin/main."
            exit 1
          }

      - name: Resolve immutable revision and release metadata
        id: revision
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          sha="$(git rev-parse HEAD)"
          version="$(node -p "require('./package.json').version")"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          node scripts/releasePreflight.mjs create-metadata \
            --revision "$sha" \
            --version "$version" \
            --repository "$REPOSITORY" \
            --run-id "$WORKFLOW_RUN_ID" \
            --event "$EVENT_NAME" \
            --output "$RUNNER_TEMP/release-metadata.json"

      - name: Publish immutable release metadata artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexo-release-metadata-${{ steps.revision.outputs.sha }}
          path: ${{ runner.temp }}/release-metadata.json
          if-no-files-found: error
          retention-days: 30

  preflight:
    needs: prepare
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      pages: write
    env:
      GITHUB_PAGES: 'true'
      GITHUB_PAGES_BASE: '/'
      VITE_BUILD_SHA: ${{ needs.prepare.outputs.sha }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_MEASUREMENT_ID: ${{ vars.VITE_FIREBASE_MEASUREMENT_ID }}
      VITE_RECAPTCHA_ENTERPRISE_SITE_KEY: ${{ vars.VITE_RECAPTCHA_ENTERPRISE_SITE_KEY }}
      VITE_CATALOG_API_URL: ${{ vars.VITE_CATALOG_API_URL }}
      VITE_CATALOG_PROXY_URL: ${{ vars.VITE_CATALOG_PROXY_URL }}
      VITE_PUBLIC_CATALOG_URL: ${{ vars.VITE_PUBLIC_CATALOG_URL }}
      VITE_DEMO_MODE: 'false'
      VITE_USE_FIREBASE_EMULATORS: 'false'
      RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}/.nexo-release-artifact
    steps:
      - name: Checkout approved revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Download immutable release metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexo-release-metadata-${{ needs.prepare.outputs.sha }}
          path: ${{ runner.temp }}/nexo-release-metadata

      - name: Verify immutable release metadata
        run: >-
          node scripts/releasePreflight.mjs verify-metadata
          --file "${{ runner.temp }}/nexo-release-metadata/release-metadata.json"
          --revision "${{ needs.prepare.outputs.sha }}"
          --version "${{ needs.prepare.outputs.version }}"

      - name: Setup Java for Firebase emulators
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm --prefix functions ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Require production frontend configuration
        shell: bash
        run: |
          for name in \
            VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET VITE_FIREBASE_MESSAGING_SENDER_ID VITE_FIREBASE_APP_ID \
            VITE_FIREBASE_MEASUREMENT_ID VITE_CATALOG_API_URL VITE_CATALOG_PROXY_URL VITE_PUBLIC_CATALOG_URL; do
            test -n "${!name}" || { echo "$name is required."; exit 1; }
          done

      - name: Run complete immutable release preflight
        run: npm run release:check

      - name: Build exact Worker preflight bundle
        shell: bash
        run: |
          worker_dir="$RUNNER_TEMP/nexo-worker-bundle"
          rm -rf "$worker_dir"
          mkdir -p "$worker_dir"
          npx --no-install wrangler deploy workers/catalog-proxy/src/index.js \
            --dry-run \
            --env="" \
            --config workers/catalog-proxy/wrangler.jsonc \
            --var "BUILD_SHA:${{ needs.prepare.outputs.sha }}" \
            --var "NEXO_VERSION:${{ needs.prepare.outputs.version }}" \
            --outdir "$worker_dir" \
            --metafile "$worker_dir/bundle-meta.json"

      - name: Stage and verify exact preflight artifacts
        shell: bash
        run: |
          rm -rf "$RELEASE_ARTIFACT_ROOT"
          mkdir -p "$RELEASE_ARTIFACT_ROOT/functions" "$RELEASE_ARTIFACT_ROOT/worker"
          cp "${{ runner.temp }}/nexo-release-metadata/release-metadata.json" "$RELEASE_ARTIFACT_ROOT/release-metadata.json"
          cp -R dist "$RELEASE_ARTIFACT_ROOT/dist"
          cp -R functions/lib "$RELEASE_ARTIFACT_ROOT/functions/lib"
          cp -R "$RUNNER_TEMP/nexo-worker-bundle/." "$RELEASE_ARTIFACT_ROOT/worker/"
          node scripts/releasePreflight.mjs create-manifest \
            --root "$RELEASE_ARTIFACT_ROOT" \
            --metadata "$RELEASE_ARTIFACT_ROOT/release-metadata.json" \
            --output "$RELEASE_ARTIFACT_ROOT/preflight-manifest.json" \
            --include dist \
            --include functions/lib \
            --include worker
          node scripts/releasePreflight.mjs verify-manifest \
            --root "$RELEASE_ARTIFACT_ROOT" \
            --metadata "$RELEASE_ARTIFACT_ROOT/release-metadata.json" \
            --manifest "$RELEASE_ARTIFACT_ROOT/preflight-manifest.json" \
            --revision "${{ needs.prepare.outputs.sha }}" \
            --version "${{ needs.prepare.outputs.version }}"

      - name: Upload immutable deployment artifacts and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexo-preflight-${{ needs.prepare.outputs.sha }}
          path: ${{ runner.temp }}/nexo-release-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload exact Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ env.RELEASE_ARTIFACT_ROOT }}/dist

  deploy-firebase:
    needs: [prepare, preflight]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}/.nexo-release-artifact
    steps:
      - name: Checkout approved revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Download exact preflight artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexo-preflight-${{ needs.prepare.outputs.sha }}
          path: ${{ runner.temp }}/nexo-release-artifact

      - name: Verify artifact provenance and immutable revision
        run: >-
          node scripts/releasePreflight.mjs verify-manifest
          --root "$RELEASE_ARTIFACT_ROOT"
          --metadata "$RELEASE_ARTIFACT_ROOT/release-metadata.json"
          --manifest "$RELEASE_ARTIFACT_ROOT/preflight-manifest.json"
          --revision "${{ needs.prepare.outputs.sha }}"
          --version "${{ needs.prepare.outputs.version }}"

      - name: Install exact preflighted Functions output
        shell: bash
        run: |
          rm -rf functions/lib
          cp -R "$RELEASE_ARTIFACT_ROOT/functions/lib" functions/lib

      - name: Require Firebase deployment identity
        env:
          WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          test -n "$WIF_PROVIDER" || { echo 'GCP_WORKLOAD_IDENTITY_PROVIDER is required.'; exit 1; }
          test -n "$WIF_SERVICE_ACCOUNT" || { echo 'GCP_SERVICE_ACCOUNT is required.'; exit 1; }

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          create_credentials_file: true

      - name: Install deployment dependencies
        run: |
          npm ci
          npm --prefix functions ci

      - name: Stamp exact Functions revision
        run: |
          printf 'BUILD_SHA=%s\nNEXO_VERSION=%s\nNEXO_ALLOWED_ORIGINS=%s\nNEXO_ENFORCE_APP_CHECK=false\n' \
            '${{ needs.prepare.outputs.sha }}' \
            '${{ needs.prepare.outputs.version }}' \
            'https://nexo.codeoverdose.es' > functions/.env

      - name: Normalize compatible legacy Firestore fields
        run: npm run normalize:firestore-data -- --write

      - name: Audit production Firestore compatibility
        run: npm run audit:firestore-data

      - name: Upload Firestore normalization and audit reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firestore-data-audit-${{ github.run_id }}
          path: |
            .firestore-audit/normalization.json
            .firestore-audit/report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Deploy Functions, Firestore rules and indexes
        run: npx --no-install firebase-tools deploy --only functions,firestore --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Normalize catalog seed
        if: github.event_name != 'workflow_dispatch' || inputs.skip_seed != true
        run: npm run catalog:normalize

      - name: Write public catalog seed
        if: github.event_name != 'workflow_dispatch' || inputs.skip_seed != true
        run: npm run catalog:write:prod

  deploy-worker:
    needs: [prepare, preflight, deploy-firebase]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      actions: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}/.nexo-release-artifact
    steps:
      - name: Checkout approved revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Download exact preflight artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexo-preflight-${{ needs.prepare.outputs.sha }}
          path: ${{ runner.temp }}/nexo-release-artifact

      - name: Verify artifact provenance and immutable revision
        run: >-
          node scripts/releasePreflight.mjs verify-manifest
          --root "$RELEASE_ARTIFACT_ROOT"
          --metadata "$RELEASE_ARTIFACT_ROOT/release-metadata.json"
          --manifest "$RELEASE_ARTIFACT_ROOT/preflight-manifest.json"
          --revision "${{ needs.prepare.outputs.sha }}"
          --version "${{ needs.prepare.outputs.version }}"

      - name: Require scoped Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is required.'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is required.'; exit 1; }

      - name: Install deployment dependencies
        run: npm ci

      - name: Deploy exact preflighted Worker bundle
        shell: bash
        run: |
          cp "$RELEASE_ARTIFACT_ROOT/worker/index.js" workers/catalog-proxy/preflight-worker.js
          npx --no-install wrangler deploy workers/catalog-proxy/preflight-worker.js \
            --no-bundle \
            --env="" \
            --config workers/catalog-proxy/wrangler.jsonc \
            --var "BUILD_SHA:${{ needs.prepare.outputs.sha }}" \
            --var "NEXO_VERSION:${{ needs.prepare.outputs.version }}" \
            --strict

  deploy-pages:
    needs: [prepare, preflight, deploy-firebase, deploy-worker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      pages: write
    env:
      RELEASE_ARTIFACT_ROOT: ${{ github.workspace }}/.nexo-release-artifact
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout approved revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Download and verify exact preflight artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nexo-preflight-${{ needs.prepare.outputs.sha }}
          path: ${{ runner.temp }}/nexo-release-artifact

      - name: Verify Pages provenance and immutable revision
        env:
          RELEASE_ARTIFACT_ROOT: ${{ runner.temp }}/nexo-release-artifact
        run: >-
          node scripts/releasePreflight.mjs verify-manifest
          --root "$RELEASE_ARTIFACT_ROOT"
          --metadata "$RELEASE_ARTIFACT_ROOT/release-metadata.json"
          --manifest "$RELEASE_ARTIFACT_ROOT/preflight-manifest.json"
          --revision "${{ needs.prepare.outputs.sha }}"
          --version "${{ needs.prepare.outputs.version }}"

      - name: Deploy exact Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  production-smoke:
    needs: [prepare, deploy-firebase, deploy-worker, deploy-pages]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      E2E_PROD_BASE_URL: https://nexo.codeoverdose.es
      E2E_EXPECTED_REVISION: ${{ needs.prepare.outputs.sha }}
      E2E_EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
      E2E_PUBLIC_CATALOG_URL: ${{ vars.VITE_PUBLIC_CATALOG_URL }}
      E2E_CATALOG_API_URL: ${{ vars.VITE_CATALOG_API_URL }}
      E2E_CATALOG_PROXY_URL: ${{ vars.VITE_CATALOG_PROXY_URL }}
      E2E_BACKEND_HEALTH_URL: ${{ vars.E2E_BACKEND_HEALTH_URL }}
      E2E_PROD_MOD_EMAIL: ${{ secrets.E2E_PROD_MOD_EMAIL }}
      E2E_PROD_MOD_PASSWORD: ${{ secrets.E2E_PROD_MOD_PASSWORD }}
      VITE_PUBLIC_CATALOG_URL: ${{ vars.VITE_PUBLIC_CATALOG_URL }}
    steps:
      - name: Checkout approved revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Require production smoke credentials
        run: |
          for name in E2E_EXPECTED_REVISION E2E_EXPECTED_VERSION E2E_PUBLIC_CATALOG_URL E2E_CATALOG_API_URL \
            E2E_BACKEND_HEALTH_URL E2E_PROD_MOD_EMAIL E2E_PROD_MOD_PASSWORD; do
            test -n "${!name}" || { echo "$name is required."; exit 1; }
          done

      - name: Wait for the approved revision and version on every production surface
        shell: bash
        run: |
          worker_health="${E2E_CATALOG_API_URL%/}/health"
          wait_for_metadata() {
            endpoint="$1"
            for attempt in {1..30}; do
              if payload="$(curl --connect-timeout 3 --max-time 8 --fail --silent --show-error \
                --header 'Cache-Control: no-cache' "$endpoint" || true)"; then
                if printf '%s' "$payload" | EXPECTED_REVISION="$E2E_EXPECTED_REVISION" EXPECTED_VERSION="$E2E_EXPECTED_VERSION" \
                  node -e "let body='';process.stdin.on('data',c=>body+=c);process.stdin.on('end',()=>{try{const value=JSON.parse(body);process.exit(value.revision===process.env.EXPECTED_REVISION&&value.version===process.env.EXPECTED_VERSION?0:1)}catch{process.exit(1)}})"; then
                  return 0
                fi
              fi
              sleep 5
            done
            echo "$endpoint never exposed revision $E2E_EXPECTED_REVISION and version $E2E_EXPECTED_VERSION."
            return 1
          }
          wait_for_metadata "$E2E_PROD_BASE_URL/version.json?revision=$E2E_EXPECTED_REVISION"
          wait_for_metadata "$worker_health"
          wait_for_metadata "$E2E_BACKEND_HEALTH_URL"

      - name: Record cross-service revision agreement evidence
        run: |
          node -e "require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/nexo-production-release-evidence.json', JSON.stringify({schemaVersion:1,revision:process.env.E2E_EXPECTED_REVISION,version:process.env.E2E_EXPECTED_VERSION,jobOrder:['preflight','deploy-firebase','deploy-worker','deploy-pages','production-smoke'],surfaces:{pages:'version.json',worker:process.env.E2E_CATALOG_API_URL.replace(/\\/$/,'')+'/health',functions:process.env.E2E_BACKEND_HEALTH_URL},releaseTag:'v'+process.env.E2E_EXPECTED_VERSION},null,2)+'\\n')"

      - name: Production smoke
        run: npm run test:e2e:prod

      - name: Upload production revision evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nexo-production-release-evidence.json
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 30

  publish-release:
    if: github.event_name == 'workflow_run'
    needs: [prepare, production-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout deployed revision with tags
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: Publish tag and GitHub release idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            deployed_tag_sha="$(git rev-list -n 1 "$tag")"
            test "$deployed_tag_sha" = "$RELEASE_SHA" || {
              echo "$tag already points to $deployed_tag_sha instead of $RELEASE_SHA."
              exit 1
            }
            gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --verify-tag --generate-notes
            exit 0
          fi
          gh release create "$tag" --target "$RELEASE_SHA" --generate-notes
